baseURL = 'https://hide-on-bush-xk.github.io/'
locale = 'en-us'
title = 'Ke XU | ECE Researcher'
theme = 'PaperMod'

[params]
  defaultTheme = "auto"
  ShowThemeToggle = true
  description = "Ke Xu — PhD student in ECE at Virginia Tech, researching wireless communications, massive access, and Age of Information."
  keywords = ["Ke Xu", "Virginia Tech", "ECE", "Wireless Communications", "Age of Information", "PhD"]
  author = "Ke Xu"
  
  [params.profileMode]
    enabled = true
    title = "Hello, I'm XU, Ke."
    subtitle = "PhD Student in ECE @ Virginia Tech | Previously Network Engineer @ Ericsson. Focusing on Wireless Communications."
    
    # ---- 个人照片配置开始 ----
    # 注意：路径不要写 static，直接从 images/ 开始写，Hugo 会自动去 static 目录下寻找
    imageUrl = "images/avatar.jpeg" 
    imageWidth = 180              # 建议尺寸 150-180 之间，PaperMod 会自动渲染为优雅的圆形
    imageHeight = 180
    # ---- 个人照片配置结束 ----
    
    [[params.profileMode.buttons]]
      name = "ORCID"
      url = "https://orcid.org/my-orcid?orcid=0000-0001-5447-8008"
    # 带 options 的按钮：鼠标悬停（或点击）展开菜单，点选项即复制到剪贴板
    [[params.profileMode.buttons]]
      name = "Email"
      [[params.profileMode.buttons.options]]
        label = "School"
        value = "kexu@vt.edu"
      [[params.profileMode.buttons.options]]
        label = "Personal"
        value = "xuke695615201@gmail.com"
    [[params.profileMode.buttons]]
      name = "Phone"
      [[params.profileMode.buttons.options]]
        label = "US"
        value = "+1 540 204 5233"
      [[params.profileMode.buttons.options]]
        label = "China"
        value = "+86 177 1508 5190"
    [[params.profileMode.buttons]]
      name = "LinkedIn"
      url = "https://www.linkedin.com/in/kexu5190"
    [[params.profileMode.buttons]]
      name = "Google Scholar"
      url = "https://scholar.google.com/citations?user=clGpG94AAAAJ&hl=en"

      

